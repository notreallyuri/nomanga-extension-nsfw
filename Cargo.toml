[package]
name = "extension_nsfw"
version = "0.1.2"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1"
nomanga-sdk = { git = "https://github.com/notreallyuri/nomanga", branch = "main" }
serde = { version ="1.0", features = ["derive"] }
serde_json = "1.0"
scraper = "0.27"
regex = "1.13"

# Inherited from the nomanga workspace before the split; without it the wasm is
# several times larger.
[profile.release]
lto = true
opt-level = "z"
strip = true
